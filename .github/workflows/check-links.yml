name: Check links

# Fails the build when the site references a local file that does not exist
# (e.g. a missing image), before it reaches GitHub Pages.
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: lycheeverse/lychee-action@v2
        with:
          args: --offline --no-progress --root-dir "${{ github.workspace }}" index.html
          fail: true
